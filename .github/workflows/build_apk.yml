name: Build MEGWIL AI APK

on:
  push:
    branches: [ "main", "feature/phone-control-long-memory" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Gradle 8.6
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.6-bin.zip -O /tmp/gradle-8.6-bin.zip
          unzip -q /tmp/gradle-8.6-bin.zip -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.6/bin" >> "$GITHUB_PATH"

      - name: Set up Android SDK packages
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Build debug APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          JARVIS_OWNER_GMAIL: ${{ secrets.MEGWIL_OWNER_GMAIL }}
        run: gradle assembleDebug --no-daemon

      - name: Show debug APK signing fingerprint
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          APK="$GITHUB_WORKSPACE/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs "$APK"

      - name: Boot cloud Android emulator and smoke-test MEGWIL
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim
          disable-animations: true
          script: |
            set -eu
            cd "$GITHUB_WORKSPACE"
            APK="$GITHUB_WORKSPACE/app/build/outputs/apk/debug/app-debug.apk"
            SCREENSHOT="$GITHUB_WORKSPACE/megwil-home.png"
            LOGCAT="$GITHUB_WORKSPACE/megwil-logcat.txt"
            test -s "$APK"

            adb wait-for-device
            adb install -r "$APK"
            adb shell am force-stop com.megwil.ai || true
            adb shell am start -n com.megwil.ai/.MainActivity

            for attempt in $(seq 1 12); do
              if adb shell pidof com.megwil.ai | tr -d '\r' | grep -q '[0-9]'; then
                break
              fi
              sleep 2
            done
            adb shell pidof com.megwil.ai

            adb shell input keyevent 82 || true
            sleep 3
            adb exec-out screencap -p > "$SCREENSHOT"
            test -s "$SCREENSHOT"
            file "$SCREENSHOT"

            adb logcat -d -t 5000 > "$LOGCAT"
            if grep -E "FATAL EXCEPTION|AndroidRuntime: FATAL" "$LOGCAT"; then
              exit 1
            fi

      - name: Upload APK and cloud phone test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MegwilAI-Cloud-Test
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            megwil-home.png
            megwil-logcat.txt
          if-no-files-found: warn
          retention-days: 14
