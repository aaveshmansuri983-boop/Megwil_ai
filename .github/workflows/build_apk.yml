name: Build MEGWIL AI APK

on:
  push:
    branches: [ "main", "feature/phone-control-long-memory" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Gradle 8.6
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.6-bin.zip -O /tmp/gradle-8.6-bin.zip
          unzip -q /tmp/gradle-8.6-bin.zip -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.6/bin" >> "$GITHUB_PATH"

      - name: Set up Android SDK packages
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Build debug APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          JARVIS_OWNER_GMAIL: ${{ secrets.MEGWIL_OWNER_GMAIL }}
        run: gradle assembleDebug --no-daemon

      - name: Show debug APK signing fingerprint
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          APK="$GITHUB_WORKSPACE/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs "$APK"

      - name: Prepare cloud smoke-test script
        run: |
          cat > "$GITHUB_WORKSPACE/megwil-cloud-smoke-test.sh" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          APK="$GITHUB_WORKSPACE/app/build/outputs/apk/debug/app-debug.apk"
          SCREENSHOT="$GITHUB_WORKSPACE/megwil-home.png"
          LOGCAT="$GITHUB_WORKSPACE/megwil-logcat.txt"

          echo "Workspace: $GITHUB_WORKSPACE"
          echo "APK expected at: $APK"
          ls -lh "$GITHUB_WORKSPACE/app/build/outputs/apk/debug/"
          test -s "$APK"

          # Wait until Android has fully booted and Package Manager responds.
          adb wait-for-device
          boot_ready=0
          for attempt in $(seq 1 18); do
            if [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\\r')" = "1" ] && adb shell cmd package list packages >/dev/null 2>&1; then
              boot_ready=1
              break
            fi
            echo "Android/Package Manager not ready yet (attempt $attempt/18)"
            sleep 5
          done
          if [ "$boot_ready" -ne 1 ]; then
            echo "Android did not become ready for package installation."
            adb shell getprop sys.boot_completed || true
            adb logcat -d -t 1200 | tail -n 250 || true
            exit 1
          fi

          # Avoid streamed-install pipe failures; retry transient emulator service errors.
          install_ok=0
          for attempt in $(seq 1 3); do
            echo "Installing MEGWIL APK (attempt $attempt/3)"
            if adb install --no-streaming -r "$APK"; then
              install_ok=1
              break
            fi
            echo "APK install failed; checking Package Manager before retry."
            adb shell cmd package list packages >/dev/null 2>&1 || true
            sleep 10
          done
          if [ "$install_ok" -ne 1 ]; then
            echo "MEGWIL APK installation failed after 3 attempts."
            adb logcat -d -t 2000 | tail -n 350 || true
            exit 1
          fi

          adb shell am force-stop com.megwil || true
          adb shell am start -W -n com.megwil/.MainActivity

          # Wait for the actual Compose home screen, not merely a live process
          # or Android's launch splash screen. First cold start can be slow on CI.
          ui_ready=0
          for attempt in $(seq 1 24); do
            adb shell uiautomator dump /sdcard/megwil-window.xml >/dev/null 2>&1 || true
            UI_XML="$(adb shell cat /sdcard/megwil-window.xml 2>/dev/null | tr -d '\\r' || true)"
            if printf '%s' "$UI_XML" | grep -qi 'MEGWIL AI' &&
               printf '%s' "$UI_XML" | grep -Eqi 'CONVERSATION|Ask MEGWIL anything' &&
               printf '%s' "$UI_XML" | grep -Eqi 'GOOGLE LOGIN|SEND|VOICE'; then
              ui_ready=1
              echo "MEGWIL home screen and primary controls are visible."
              break
            fi
            echo "Waiting for MEGWIL Compose home UI (attempt $attempt/24)..."
            sleep 5
          done

          if [ "$ui_ready" -ne 1 ]; then
            echo "MEGWIL home UI did not become visible; refusing to mark splash-only launch as passed."
            echo "Last UI hierarchy:"
            printf '%s\\n' "$UI_XML" | head -c 12000 || true
            adb logcat -d -t 5000 > "$LOGCAT"
            tail -n 350 "$LOGCAT" || true
            exit 1
          fi

          adb shell pidof com.megwil
          adb shell input keyevent 82 || true
          sleep 2
          adb exec-out screencap -p > "$SCREENSHOT"
          test -s "$SCREENSHOT"
          file "$SCREENSHOT"

          adb logcat -d -t 5000 > "$LOGCAT"
          if grep -E "FATAL EXCEPTION|AndroidRuntime: FATAL" "$LOGCAT"; then
            exit 1
          fi
          EOF
          chmod +x "$GITHUB_WORKSPACE/megwil-cloud-smoke-test.sh"

      - name: Boot cloud Android emulator and smoke-test MEGWIL
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim
          disable-animations: true
          script: bash "$GITHUB_WORKSPACE/megwil-cloud-smoke-test.sh"

      - name: Upload APK and cloud phone test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MegwilAI-Cloud-Test
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            megwil-home.png
            megwil-logcat.txt
          if-no-files-found: warn
          retention-days: 14
