name: Build MEGWIL AI APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Gradle 8.6
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.6-bin.zip -O /tmp/gradle-8.6-bin.zip
          unzip -q /tmp/gradle-8.6-bin.zip -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.6/bin" >> "$GITHUB_PATH"

      - name: Set up Android SDK packages
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Build debug APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          JARVIS_OWNER_GMAIL: ${{ secrets.JARVIS_OWNER_GMAIL }}
        run: gradle assembleDebug --no-daemon

      - name: Boot cloud Android emulator and smoke-test MEGWIL
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim
          disable-animations: true
          script: |
            set -e
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am force-stop com.megwil.ai || true
            adb shell am start -W -n com.megwil.ai/.MainActivity
            sleep 8
            adb shell pidof com.megwil.ai
            adb shell screencap -p /sdcard/megwil-home.png
            adb pull /sdcard/megwil-home.png megwil-home.png
            adb logcat -d -t 3000 > megwil-logcat.txt
            if grep -E "FATAL EXCEPTION|AndroidRuntime: FATAL" megwil-logcat.txt; then
              exit 1
            fi

      - name: Upload APK and cloud phone test evidence
        uses: actions/upload-artifact@v4
        with:
          name: MegwilAI-Cloud-Test
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            megwil-home.png
            megwil-logcat.txt
          if-no-files-found: error
          retention-days: 14
