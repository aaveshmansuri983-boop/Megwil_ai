name: Build JARVIS V3 Android APK

on:
  push:
    branches: ["jarvis-android-fix"]
    paths:
      - "jarvis-app-android-v3.zip"
      - ".github/workflows/build_jarvis_android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-jarvis-android:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout JARVIS source archive
        uses: actions/checkout@v4

      - name: Verify and extract the actual JARVIS V3 source
        id: source
        shell: bash
        run: |
          set -euo pipefail
          test -s jarvis-app-android-v3.zip
          mkdir -p "$RUNNER_TEMP/jarvis-v3"
          unzip -q jarvis-app-android-v3.zip -d "$RUNNER_TEMP/jarvis-v3"
          PROJECT="$RUNNER_TEMP/jarvis-v3/jarvis-app-0.1.0"
          test -f "$PROJECT/src-tauri/Cargo.toml"
          test -f "$PROJECT/src-tauri/tauri.conf.json"
          test -f "$PROJECT/src/index.html"
          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"
          echo "Building the Tauri/Rust JARVIS V3 archive (not MEGWIL additive source)."

          # Android source patch is applied from a standalone Python script to avoid YAML/heredoc escaping.
          cat > "$RUNNER_TEMP/patch_jarvis.py" <<'PY'
          from pathlib import Path
          import re, sys

          root = Path(sys.argv[1]) / "src-tauri" / "src"
          lib_path = root / "lib.rs"
          s = lib_path.read_text()

          def add_cfg(statement):
              global s
              if statement not in s:
                  raise SystemExit("Missing Rust source item: " + statement)
              s = s.replace(statement, '#[cfg(not(target_os = "android"))]\n' + statement, 1)

          add_cfg("use tauri::menu::{CheckMenuItemBuilder, MenuBuilder, MenuItemBuilder};")
          add_cfg("use tauri::tray::{MouseButton, MouseButtonState, TrayIconBuilder, TrayIconEvent};")
          add_cfg("use tauri_plugin_autostart::ManagerExt;")
          add_cfg('const TRAY_ID: &str = "main-tray";')
          # Remove the desktop-only window decoration call from the Android build copy.
          decorations_pattern = re.compile(r"(?m)^[ \t]*\.decorations\(false\)[ \t]*\r?\n")
          if not decorations_pattern.search(s):
              raise SystemExit("Desktop-only decorations(false) call not found")
          s, removed = decorations_pattern.subn("", s, count=1)
          if removed != 1:
              raise SystemExit("Expected to remove exactly one decorations(false) call")

          # This script patches only the Android build copy; remove desktop-only widget-window APIs.
          for desktop_method in ("        .always_on_top(true)\n", "        .skip_taskbar(true)\n"):
              if desktop_method not in s:
                  raise SystemExit("Expected desktop-only widget method not found: " + desktop_method.strip())
              s = s.replace(desktop_method, "", 1)

          tray_tooltip_pattern = re.compile(r"(?ms)^fn set_tray_tooltip\([^\n]*\) \{\n.*?^\}")
          tooltip_match = tray_tooltip_pattern.search(s)
          if not tooltip_match:
              raise SystemExit("Tray tooltip function not found")
          desktop_tooltip_fn = tooltip_match.group(0)
          android_tooltip_stub = (
              '\n#[cfg(target_os = "android")]\n'
              'fn set_tray_tooltip(_app: &AppHandle, _tooltip: &str) {}\n'
          )
          s = (
              s[:tooltip_match.start()]
              + '#[cfg(not(target_os = "android"))]\n'
              + desktop_tooltip_fn
              + android_tooltip_stub
              + s[tooltip_match.end():]
          )

          picker = re.compile(r"#\[tauri::command\]\s*async fn pick_widget_appearance_folder\(.*?\n\}", re.S)
          m = picker.search(s)
          if not m:
              raise SystemExit("Folder picker function not found")
          android_picker = (
              '\n#[cfg(target_os = "android")]\n'
              '#[tauri::command]\n'
              'async fn pick_widget_appearance_folder(_id: String, _app: AppHandle) -> Option<String> { None }\n'
          )
          s = s[:m.start()] + '#[cfg(not(target_os = "android"))]\n' + m.group(0) + android_picker + s[m.end():]

          # Android builds don't have the desktop system tray.
          tray_pattern = re.compile(r"let show_hide = MenuItemBuilder::with_id")
          m = tray_pattern.search(s)
          if m:
              # Mark the full setup block from menu creation through tray build.
              end = s.find("tray_builder.build(app)?;", m.start())
              if end < 0:
                  raise SystemExit("Tray build call not found")
              end += len("tray_builder.build(app)?;")
              block = s[m.start():end]
              s = s[:m.start()] + '#[cfg(not(target_os = "android"))]\n            {\n' + ''.join("    " + line + "\n" for line in block.splitlines()) + "            }" + s[end:]

          # Autostart registration is desktop-only.
          old = '''    tauri::Builder::default()
                  .plugin(tauri_plugin_autostart::init(
                      tauri_plugin_autostart::MacosLauncher::LaunchAgent,
                      None,
                  ))
                  .plugin(tauri_plugin_dialog::init())'''
          new = '''    let builder = tauri::Builder::default();
              #[cfg(not(target_os = "android"))]
              let builder = builder.plugin(tauri_plugin_autostart::init(
                  tauri_plugin_autostart::MacosLauncher::LaunchAgent, None,
              ));
              builder.plugin(tauri_plugin_dialog::init())'''
          if old not in s:
              raise SystemExit("Autostart plugin builder not found")
          s = s.replace(old, new, 1)
          lib_path.write_text(s)

          ipc_path = root / "ipc.rs"
          ipc = ipc_path.read_text()
          if '#[cfg(target_os = "android")]' not in ipc:
              pos = ipc.find('    #[cfg(windows)]')
              if pos < 0:
                  raise SystemExit("Windows data-dir cfg not found")
              ipc = ipc[:pos] + '''    #[cfg(target_os = "android")]
              {
                  let base = std::env::var("HOME").or_else(|_| std::env::var("TMPDIR"))
                      .unwrap_or_else(|_| "/data/local/tmp".into());
                  format!("{}/jarvis", base)
              }
          ''' + ipc[pos:]
              ipc_path.write_text(ipc)
          print("JARVIS Android compatibility patch applied")
          PY
          python3 "$RUNNER_TEMP/patch_jarvis.py" "$PROJECT"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure preinstalled Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          test -d "$SDK_ROOT"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "Using Android SDK at $SDK_ROOT"

      - name: Install Android SDK and NDK packages
        shell: bash
        run: |
          set -euo pipefail
          # sdkmanager exits after reading the available answers; with pipefail, yes's
          # expected SIGPIPE is incorrectly treated as a failed licence step.
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null
          set -o pipefail
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.0.12077973" \
            "cmake;3.22.1"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - name: Install Rust Android target
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-linux-android

      - name: Install Tauri CLI v2
        timeout-minutes: 20
        env:
          CARGO_NET_RETRY: "5"
          CARGO_HTTP_TIMEOUT: "120"
        run: |
          set -euo pipefail
          if ! command -v cargo-tauri >/dev/null 2>&1; then
            cargo install tauri-cli --version "^2" --locked --jobs 2
          fi
          cargo tauri --version

      - name: Initialize Tauri Android project
        working-directory: ${{ steps.source.outputs.project }}
        env:
          CI: "true"
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
          NDK_HOME: ${{ env.NDK_HOME }}
        run: cargo tauri android init --ci --skip-targets-install

      - name: Inspect Android source compatibility
        working-directory: ${{ steps.source.outputs.project }}
        shell: bash
        run: |
          echo '===== ROOT FILES ====='
          find . -maxdepth 2 -type f | sort | head -120
          echo '===== TAURI CARGO ====='
          cat src-tauri/Cargo.toml
          echo '===== LIB RS ====='
          sed -n '1,760p' src-tauri/src/lib.rs
          echo '===== IPC RS ====='
          cat src-tauri/src/ipc.rs

      - name: Build JARVIS Android APK (ARM64)
        working-directory: ${{ steps.source.outputs.project }}
        env:
          CI: "true"
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
          NDK_HOME: ${{ env.NDK_HOME }}
        run: cargo tauri android build --apk --target aarch64 --ci

      - name: Sign and verify installable APK
        shell: bash
        working-directory: ${{ steps.source.outputs.project }}
        run: |
          set -euo pipefail
          APK="$(find src-tauri/gen/android -type f -name "*.apk" | head -n 1)"
          test -n "$APK"
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          test -x "$BUILD_TOOLS/apksigner"
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/jarvis-debug.keystore" \
            -storepass android -alias androiddebugkey -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA -keysize 2048 -validity 10000
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/jarvis-debug.keystore" \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android --key-pass pass:android \
            "$APK"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"

      - name: Package APK
        shell: bash
        working-directory: ${{ steps.source.outputs.project }}
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/dist"
          find src-tauri/gen/android -type f -name "*.apk" -print
          APK="$(find src-tauri/gen/android -type f -name "*.apk" | head -n 1)"
          test -n "$APK"
          cp "$APK" "$GITHUB_WORKSPACE/dist/JARVIS-V3-Android-arm64.apk"
          cat > "$GITHUB_WORKSPACE/dist/INSTALL.txt" <<'EOF'
          JARVIS V3 Android ARM64 test build
          Install JARVIS-V3-Android-arm64.apk on a compatible 64-bit Android device.
          This APK is debug-signed for direct installation. A separate release key is required for Play Store publication.
          EOF
          sha256sum "$GITHUB_WORKSPACE/dist/JARVIS-V3-Android-arm64.apk" > "$GITHUB_WORKSPACE/dist/SHA256SUMS.txt"
          (cd "$GITHUB_WORKSPACE/dist" && zip -9 "$GITHUB_WORKSPACE/JARVIS-V3-Android.zip" JARVIS-V3-Android-arm64.apk INSTALL.txt SHA256SUMS.txt)

      - name: Upload JARVIS V3 APK and install ZIP
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-V3-Android-APK
          path: |
            dist/JARVIS-V3-Android-arm64.apk
            JARVIS-V3-Android.zip
            dist/INSTALL.txt
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
