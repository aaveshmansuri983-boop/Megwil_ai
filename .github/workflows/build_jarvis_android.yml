name: Build JARVIS V3 Android APK

on:
  push:
    branches: ["jarvis-android-fix"]
    paths:
      - "jarvis-app-android-v3.zip"
      - ".github/workflows/build_jarvis_android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-jarvis-android:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout JARVIS source archive
        uses: actions/checkout@v4

      - name: Verify and extract the actual JARVIS V3 source
        id: source
        shell: bash
        run: |
          set -euo pipefail
          test -s jarvis-app-android-v3.zip
          mkdir -p "$RUNNER_TEMP/jarvis-v3"
          unzip -q jarvis-app-android-v3.zip -d "$RUNNER_TEMP/jarvis-v3"
          PROJECT="$RUNNER_TEMP/jarvis-v3/jarvis-app-0.1.0"
          test -f "$PROJECT/src-tauri/Cargo.toml"
          test -f "$PROJECT/src-tauri/tauri.conf.json"
          test -f "$PROJECT/src/index.html"
          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"
          echo "Building the Tauri/Rust JARVIS V3 archive (not MEGWIL additive source)."

          # Android port compatibility patch: keep desktop-only Tauri APIs out of Android builds.
          python3 - "$PROJECT" <<'PY'
          from pathlib import Path
          import sys
          root = Path(sys.argv[1]) / "src-tauri/src"
          p = root / "lib.rs"
          s = p.read_text()
          s = s.replace('use tauri::menu::{CheckMenuItemBuilder, MenuBuilder, MenuItemBuilder};\\n', '#[cfg(not(target_os = "android"))]\\nuse tauri::menu::{CheckMenuItemBuilder, MenuBuilder, MenuItemBuilder};\\n')
          s = s.replace('use tauri::tray::{MouseButton, MouseButtonState, TrayIconBuilder, TrayIconEvent};\\n', '#[cfg(not(target_os = "android"))]\\nuse tauri::tray::{MouseButton, MouseButtonState, TrayIconBuilder, TrayIconEvent};\\n')
          s = s.replace('use tauri_plugin_autostart::ManagerExt;\\n', '#[cfg(not(target_os = "android"))]\\nuse tauri_plugin_autostart::ManagerExt;\\n')
          s = s.replace('const TRAY_ID: &str = "main-tray";\\n', '#[cfg(not(target_os = "android"))]\\nconst TRAY_ID: &str = "main-tray";\\n')
          s = s.replace('        .decorations(false)\\n        .transparent(true)', '        .transparent(true)')
          s = s.replace('    let mut builder = WebviewWindowBuilder::new(app, &label, WebviewUrl::External(parsed))\\n        .title(&manifest.name)\\n        .inner_size(160.0, 160.0)\\n        .transparent(true)', '    let mut builder = WebviewWindowBuilder::new(app, &label, WebviewUrl::External(parsed))\\n        .title(&manifest.name)\\n        .inner_size(160.0, 160.0)\\n        .transparent(true)')
          # Folder selection is not available on Android; expose a safe no-op command for the UI.
          s = s.replace('#[tauri::command]\\nasync fn pick_widget_appearance_folder', '#[cfg(not(target_os = "android"))]\\n#[tauri::command]\\nasync fn pick_widget_appearance_folder', 1)
          needle = '    Some(path_str)\\n}\\n'
          pos = s.find(needle, s.find('async fn pick_widget_appearance_folder'))
          if pos < 0: raise SystemExit("could not locate end of folder picker")
          pos += len(needle)
          s = s[:pos] + '\\n#[cfg(target_os = "android")]\\n#[tauri::command]\\nasync fn pick_widget_appearance_folder(_id: String, _app: AppHandle) -> Option<String> {\\n    None\\n}\\n' + s[pos:]
          # Desktop tray tooltip helper is a no-op on Android.
          s = s.replace('fn set_tray_tooltip(app: &AppHandle, tooltip: &str) {\\n    if let Some(tray) = app.tray_by_id(TRAY_ID) {\\n        let _ = tray.set_tooltip(Some(tooltip));\\n    }\\n}', '#[cfg(not(target_os = "android"))]\\nfn set_tray_tooltip(app: &AppHandle, tooltip: &str) {\\n    if let Some(tray) = app.tray_by_id(TRAY_ID) {\\n        let _ = tray.set_tooltip(Some(tooltip));\\n    }\\n}\\n\\n#[cfg(target_os = "android")]\\nfn set_tray_tooltip(_app: &AppHandle, _tooltip: &str) {}')
          # Build the common app builder, registering autostart only on desktop.
          s = s.replace('    tauri::Builder::default()\\n        .plugin(tauri_plugin_autostart::init(\\n            tauri_plugin_autostart::MacosLauncher::LaunchAgent,\\n            None,\\n        ))\\n        .plugin(tauri_plugin_dialog::init())', '    let builder = tauri::Builder::default();\\n    #[cfg(not(target_os = "android"))]\\n    let builder = builder.plugin(tauri_plugin_autostart::init(\\n        tauri_plugin_autostart::MacosLauncher::LaunchAgent, None,\\n    ));\\n\\n    builder\\n        .plugin(tauri_plugin_dialog::init())')
          # Keep system tray construction desktop-only inside setup.
          start = '            let show_hide = MenuItemBuilder::with_id("show_hide", "Show/Hide JARVIS").build(app)?;'
          end = '            tray_builder.build(app)?;'
          a = s.find(start)
          b = s.find(end, a)
          if a < 0 or b < 0: raise SystemExit("could not locate tray setup block")
          b += len(end)
          s = s[:a] + '            #[cfg(not(target_os = "android"))]\\n' + '            {\\n' + ''.join('    '+line+'\\n' for line in s[a:b].splitlines()) + '            }' + s[b:]
          p.write_text(s)
          # Android needs an app-private writable directory fallback.
          p = root / "ipc.rs"
          s = p.read_text()
          needle = '    #[cfg(windows)]\\n    {'
          idx = s.find(needle)
          if idx < 0: raise SystemExit("could not locate windows data-dir branch")
          android = '    #[cfg(target_os = "android")]\\n    {\\n        let base = std::env::var("HOME").or_else(|_| std::env::var("TMPDIR")).unwrap_or_else(|_| "/data/local/tmp".into());\\n        format!("{}/jarvis", base)\\n    }\\n'
          s = s[:idx] + android + s[idx:]
          p.write_text(s)
          PY


      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure preinstalled Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          test -d "$SDK_ROOT"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "Using Android SDK at $SDK_ROOT"

      - name: Install Android SDK and NDK packages
        shell: bash
        run: |
          set -euo pipefail
          # sdkmanager exits after reading the available answers; with pipefail, yes's
          # expected SIGPIPE is incorrectly treated as a failed licence step.
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null
          set -o pipefail
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.0.12077973" \
            "cmake;3.22.1"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - name: Install Rust Android target
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-linux-android

      - name: Install Tauri CLI v2
        timeout-minutes: 20
        env:
          CARGO_NET_RETRY: "5"
          CARGO_HTTP_TIMEOUT: "120"
        run: |
          set -euo pipefail
          if ! command -v cargo-tauri >/dev/null 2>&1; then
            cargo install tauri-cli --version "^2" --locked --jobs 2
          fi
          cargo tauri --version

      - name: Initialize Tauri Android project
        working-directory: ${{ steps.source.outputs.project }}
        env:
          CI: "true"
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
          NDK_HOME: ${{ env.NDK_HOME }}
        run: cargo tauri android init --ci --skip-targets-install

      - name: Inspect Android source compatibility
        working-directory: ${{ steps.source.outputs.project }}
        shell: bash
        run: |
          echo '===== ROOT FILES ====='
          find . -maxdepth 2 -type f | sort | head -120
          echo '===== TAURI CARGO ====='
          cat src-tauri/Cargo.toml
          echo '===== LIB RS ====='
          sed -n '1,760p' src-tauri/src/lib.rs
          echo '===== IPC RS ====='
          cat src-tauri/src/ipc.rs

      - name: Build JARVIS Android APK (ARM64)
        working-directory: ${{ steps.source.outputs.project }}
        env:
          CI: "true"
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
          NDK_HOME: ${{ env.NDK_HOME }}
        run: cargo tauri android build --apk --target aarch64 --ci

      - name: Package APK
        shell: bash
        working-directory: ${{ steps.source.outputs.project }}
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/dist"
          find src-tauri/gen/android -type f -name "*.apk" -print
          APK="$(find src-tauri/gen/android -type f -name "*.apk" | head -n 1)"
          test -n "$APK"
          cp "$APK" "$GITHUB_WORKSPACE/dist/JARVIS-V3-Android-arm64.apk"
          cat > "$GITHUB_WORKSPACE/dist/INSTALL.txt" <<'EOF'
          JARVIS V3 Android ARM64 test build
          Install JARVIS-V3-Android-arm64.apk on a compatible 64-bit Android device.
          This is an unsigned CI test build; Play Store publication requires signing.
          EOF
          sha256sum "$GITHUB_WORKSPACE/dist/JARVIS-V3-Android-arm64.apk" > "$GITHUB_WORKSPACE/dist/SHA256SUMS.txt"
          (cd "$GITHUB_WORKSPACE/dist" && zip -9 "$GITHUB_WORKSPACE/JARVIS-V3-Android.zip" JARVIS-V3-Android-arm64.apk INSTALL.txt SHA256SUMS.txt)

      - name: Upload JARVIS V3 APK and install ZIP
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-V3-Android-APK
          path: |
            dist/JARVIS-V3-Android-arm64.apk
            JARVIS-V3-Android.zip
            dist/INSTALL.txt
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
