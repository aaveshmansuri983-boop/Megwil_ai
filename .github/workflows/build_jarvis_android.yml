name: Build JARVIS V3 Android APK

on:
  push:
    branches: ["jarvis-android-fix"]
    paths:
      - "jarvis-app-android-v3.zip"
      - ".github/workflows/build_jarvis_android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-jarvis-android:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout JARVIS source archive
        uses: actions/checkout@v4

      - name: Verify and extract the actual JARVIS V3 source
        id: source
        shell: bash
        run: |
          set -euo pipefail
          test -s jarvis-app-android-v3.zip
          mkdir -p "$RUNNER_TEMP/jarvis-v3"
          unzip -q jarvis-app-android-v3.zip -d "$RUNNER_TEMP/jarvis-v3"
          PROJECT="$RUNNER_TEMP/jarvis-v3/jarvis-app-0.1.0"
          test -f "$PROJECT/src-tauri/Cargo.toml"
          test -f "$PROJECT/src-tauri/tauri.conf.json"
          test -f "$PROJECT/src/index.html"
          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"
          echo "Building the Tauri/Rust JARVIS V3 archive (not MEGWIL additive source)."

          # Android port compatibility patch: exclude desktop-only APIs from Android.
          python3 - "$PROJECT" <<'PY'
          from pathlib import Path
          import re, sys
          root = Path(sys.argv[1]) / "src-tauri/src"
          p = root / "lib.rs"
          s = p.read_text()
          def add_cfg(line, cfg):
              if line not in s:
                  raise SystemExit("expected Rust source line missing: " + line)
              return s.replace(line, cfg + "\n" + line, 1)
          s = add_cfg("use tauri::menu::{CheckMenuItemBuilder, MenuBuilder, MenuItemBuilder};", "#[cfg(not(target_os = \\"android\\"))]")
          s = add_cfg("use tauri::tray::{MouseButton, MouseButtonState, TrayIconBuilder, TrayIconEvent};", "#[cfg(not(target_os = \\"android\\"))]")
          s = add_cfg("use tauri_plugin_autostart::ManagerExt;", "#[cfg(not(target_os = \\"android\\"))]")
          s = add_cfg('const TRAY_ID: &str = "main-tray";', "#[cfg(not(target_os = \\"android\\"))]")
          s = s.replace("        .decorations(false)\n", "")
          # Android does not provide the desktop folder picker; retain the command signature.
          pattern = r"#\[tauri::command\]\s*async fn pick_widget_appearance_folder\(.*?\n\}"
          m = re.search(pattern, s, re.S)
          if not m:
              raise SystemExit("folder picker function not found")
          desktop_fn = m.group(0)
          android_fn = '\n#[cfg(target_os = "android")]\n#[tauri::command]\nasync fn pick_widget_appearance_folder(_id: String, _app: AppHandle) -> Option<String> { None }\n'
          s = s[:m.start()] + '#[cfg(not(target_os = "android"))]\n' + desktop_fn + android_fn + s[m.end():]
          # Keep the tray helper available to shared call sites.
          tray = r"fn set_tray_tooltip\(app: &AppHandle, tooltip: &str\) \{\s*if let Some\(tray\) = app\.tray_by_id\(TRAY_ID\) \{\s*let _ = tray\.set_tooltip\(Some\(tooltip\)\);\s*\}\s*\}"
          m = re.search(tray, s)
          if m:
              s = s[:m.start()] + '#[cfg(not(target_os = "android"))]\n' + m.group(0) + '\n#[cfg(target_os = "android")]\nfn set_tray_tooltip(_app: &AppHandle, _tooltip: &str) {}' + s[m.end():]
          # Register autostart only on desktop.
          old = '''    tauri::Builder::default()
          .plugin(tauri_plugin_autostart::init(
              tauri_plugin_autostart::MacosLauncher::LaunchAgent,
              None,
          ))
          .plugin(tauri_plugin_dialog::init())'''
          new = '''    let builder = tauri::Builder::default();
          #[cfg(not(target_os = "android"))]
          let builder = builder.plugin(tauri_plugin_autostart::init(
              tauri_plugin_autostart::MacosLauncher::LaunchAgent, None,
          ));
          builder.plugin(tauri_plugin_dialog::init())'''
          if old in s:
              s = s.replace(old, new, 1)
          p.write_text(s)
          p = root / "ipc.rs"
          s = p.read_text()
          if '#[cfg(target_os = "android")]' not in s:
              needle = '    #[cfg(windows)]'
              idx = s.find(needle)
              if idx < 0: raise SystemExit("windows data-dir branch not found")
              s = s[:idx] + '''    #[cfg(target_os = "android")]
              {
                  let base = std::env::var("HOME").or_else(|_| std::env::var("TMPDIR")).unwrap_or_else(|_| "/data/local/tmp".into());
                  format!("{}/jarvis", base)
              }
          ''' + s[idx:]
              p.write_text(s)
          PY


      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure preinstalled Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          test -d "$SDK_ROOT"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "Using Android SDK at $SDK_ROOT"

      - name: Install Android SDK and NDK packages
        shell: bash
        run: |
          set -euo pipefail
          # sdkmanager exits after reading the available answers; with pipefail, yes's
          # expected SIGPIPE is incorrectly treated as a failed licence step.
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null
          set -o pipefail
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.0.12077973" \
            "cmake;3.22.1"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - name: Install Rust Android target
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-linux-android

      - name: Install Tauri CLI v2
        timeout-minutes: 20
        env:
          CARGO_NET_RETRY: "5"
          CARGO_HTTP_TIMEOUT: "120"
        run: |
          set -euo pipefail
          if ! command -v cargo-tauri >/dev/null 2>&1; then
            cargo install tauri-cli --version "^2" --locked --jobs 2
          fi
          cargo tauri --version

      - name: Initialize Tauri Android project
        working-directory: ${{ steps.source.outputs.project }}
        env:
          CI: "true"
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
          NDK_HOME: ${{ env.NDK_HOME }}
        run: cargo tauri android init --ci --skip-targets-install

      - name: Inspect Android source compatibility
        working-directory: ${{ steps.source.outputs.project }}
        shell: bash
        run: |
          echo '===== ROOT FILES ====='
          find . -maxdepth 2 -type f | sort | head -120
          echo '===== TAURI CARGO ====='
          cat src-tauri/Cargo.toml
          echo '===== LIB RS ====='
          sed -n '1,760p' src-tauri/src/lib.rs
          echo '===== IPC RS ====='
          cat src-tauri/src/ipc.rs

      - name: Build JARVIS Android APK (ARM64)
        working-directory: ${{ steps.source.outputs.project }}
        env:
          CI: "true"
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
          NDK_HOME: ${{ env.NDK_HOME }}
        run: cargo tauri android build --apk --target aarch64 --ci

      - name: Package APK
        shell: bash
        working-directory: ${{ steps.source.outputs.project }}
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/dist"
          find src-tauri/gen/android -type f -name "*.apk" -print
          APK="$(find src-tauri/gen/android -type f -name "*.apk" | head -n 1)"
          test -n "$APK"
          cp "$APK" "$GITHUB_WORKSPACE/dist/JARVIS-V3-Android-arm64.apk"
          cat > "$GITHUB_WORKSPACE/dist/INSTALL.txt" <<'EOF'
          JARVIS V3 Android ARM64 test build
          Install JARVIS-V3-Android-arm64.apk on a compatible 64-bit Android device.
          This is an unsigned CI test build; Play Store publication requires signing.
          EOF
          sha256sum "$GITHUB_WORKSPACE/dist/JARVIS-V3-Android-arm64.apk" > "$GITHUB_WORKSPACE/dist/SHA256SUMS.txt"
          (cd "$GITHUB_WORKSPACE/dist" && zip -9 "$GITHUB_WORKSPACE/JARVIS-V3-Android.zip" JARVIS-V3-Android-arm64.apk INSTALL.txt SHA256SUMS.txt)

      - name: Upload JARVIS V3 APK and install ZIP
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-V3-Android-APK
          path: |
            dist/JARVIS-V3-Android-arm64.apk
            JARVIS-V3-Android.zip
            dist/INSTALL.txt
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
