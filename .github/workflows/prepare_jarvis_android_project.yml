name: Prepare and build integrated JARVIS Android APK
# Builds only after Python, native voice, runtime assets and Rust Android checks pass.

on:
  push:
    branches: ["jarvis-android-fix"]
    paths:
      - ".github/workflows/prepare_jarvis_android_project.yml"
      - "jarvis-app-android-v3.zip"
      - "jarvis-android-runtime/**"

permissions:
  actions: read
  contents: read

concurrency:
  group: jarvis-android-project-preparation-v2
  cancel-in-progress: true

jobs:
  prepare-project:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: jarvis-android-fix
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Download and assemble latest successful ARM64 components and Python backend
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          LLM_RUN="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow build_jarvis_android_llm.yml --branch jarvis-android-fix --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          SIDECAR_RUN="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow build_jarvis_android_sidecars.yml --branch jarvis-android-fix --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          BACKEND_RUN="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow prepare_jarvis_android_backend.yml --branch jarvis-android-fix --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          for value in "$LLM_RUN" "$SIDECAR_RUN" "$BACKEND_RUN"; do
            test -n "$value" && test "$value" != "null"
          done
          gh run download "$LLM_RUN" --repo "$GITHUB_REPOSITORY" --name JARVIS-Android-ARM64-LLM --dir "$RUNNER_TEMP/llm-artifact"
          gh run download "$SIDECAR_RUN" --repo "$GITHUB_REPOSITORY" --name JARVIS-Android-ARM64-Sidecars --dir "$RUNNER_TEMP/sidecar-artifact"
          gh run download "$BACKEND_RUN" --repo "$GITHUB_REPOSITORY" --name JARVIS-Android-Python-Backend --dir "$RUNNER_TEMP/backend-artifact"
          LLM_TAR="$(find "$RUNNER_TEMP/llm-artifact" -type f -name 'JARVIS-Android-ARM64-LLM.tar.gz' | head -n 1)"
          SIDECAR_TAR="$(find "$RUNNER_TEMP/sidecar-artifact" -type f -name 'JARVIS-Android-ARM64-Sidecars.tar.gz' | head -n 1)"
          BACKEND_TAR="$(find "$RUNNER_TEMP/backend-artifact" -type f -name 'JARVIS-Android-Python-Backend.tar.gz' | head -n 1)"
          test -n "$LLM_TAR" && test -n "$SIDECAR_TAR" && test -n "$BACKEND_TAR"
          mkdir -p "$RUNNER_TEMP/llm-unpacked" "$RUNNER_TEMP/sidecars-unpacked" "$RUNNER_TEMP/backend" "$RUNNER_TEMP/runtime-assets/bin" "$RUNNER_TEMP/runtime-assets/lib"
          tar -xzf "$LLM_TAR" -C "$RUNNER_TEMP/llm-unpacked"
          tar -xzf "$SIDECAR_TAR" -C "$RUNNER_TEMP/sidecars-unpacked"
          tar -xzf "$BACKEND_TAR" -C "$RUNNER_TEMP/backend"
          (cd "$RUNNER_TEMP/llm-unpacked" && sha256sum -c SHA256SUMS.txt)
          (cd "$RUNNER_TEMP/sidecars-unpacked" && sed 's|dist/||' SHA256SUMS.txt | sha256sum -c -)
          cp "$RUNNER_TEMP/sidecars-unpacked/bin/"{dispatch,dmcp,contextor} "$RUNNER_TEMP/runtime-assets/bin/"
          cp "$RUNNER_TEMP/llm-unpacked/bin/llama-server" "$RUNNER_TEMP/runtime-assets/bin/"
          cp "$RUNNER_TEMP/llm-unpacked/lib/"*.so "$RUNNER_TEMP/runtime-assets/lib/"
          for name in libllama-server-impl.so libllama-common.so libmtmd.so libllama.so libggml.so libggml-cpu.so libggml-base.so; do
            test -s "$RUNNER_TEMP/runtime-assets/lib/$name"
          done
          chmod 0755 "$RUNNER_TEMP/runtime-assets/bin/"*
          (cd "$RUNNER_TEMP/runtime-assets" && sha256sum bin/* lib/*.so > SHA256SUMS.txt)
          {
            echo "branch=jarvis-android-fix"
            echo "llm_workflow_run=$LLM_RUN"
            echo "sidecar_workflow_run=$SIDECAR_RUN"
            echo "abi=arm64-v8a"
            echo "apk_built=false"
          } > "$RUNNER_TEMP/runtime-assets/manifest.txt"
          echo "LLM_RUN=$LLM_RUN" >> "$GITHUB_ENV"
          echo "SIDECAR_RUN=$SIDECAR_RUN" >> "$GITHUB_ENV"
          echo "BACKEND_RUN=$BACKEND_RUN" >> "$GITHUB_ENV"
      - name: Prepare pinned Android-only MCP client SDK
        shell: bash
        run: |
          set -euo pipefail
          MCP_COMMIT="09e3a05e13211d1081efcdc9a962affb02e40c05"
          git init "$RUNNER_TEMP/mcp-python-sdk"
          git -C "$RUNNER_TEMP/mcp-python-sdk" remote add origin https://github.com/modelcontextprotocol/python-sdk.git
          git -C "$RUNNER_TEMP/mcp-python-sdk" fetch --depth 1 origin "$MCP_COMMIT"
          git -C "$RUNNER_TEMP/mcp-python-sdk" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/mcp-python-sdk" rev-parse HEAD)" = "$MCP_COMMIT"
          python jarvis-android-runtime/prepare_mcp_android.py \
            --source "$RUNNER_TEMP/mcp-python-sdk/src/mcp" \
            --destination "$RUNNER_TEMP/backend/python/mcp" \
            --commit "$MCP_COMMIT"
      - name: Verify and extract JARVIS V3 source archive
        id: source
        shell: bash
        run: |
          set -euo pipefail
          test -s jarvis-app-android-v3.zip
          mkdir -p "$RUNNER_TEMP/jarvis-v3"
          unzip -q jarvis-app-android-v3.zip -d "$RUNNER_TEMP/jarvis-v3"
          PROJECT="$RUNNER_TEMP/jarvis-v3/jarvis-app-0.1.0"
          test -f "$PROJECT/src-tauri/Cargo.toml"
          test -f "$PROJECT/src-tauri/tauri.conf.json"
          test -f "$PROJECT/src/index.html"
          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"
          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"
      - name: Validate Android application identifier without changing bundle ID
        shell: bash
        run: |
          set -euo pipefail
          python - "$PROJECT/src-tauri/tauri.conf.json" <<'PY'
          import json, re, sys
          from pathlib import Path
          config = json.loads(Path(sys.argv[1]).read_text())
          identifier = config.get("identifier", "")
          # Tauri requires a bundle identifier, not a Java package name.
          # Keep hyphens intact here; the generated Kotlin package is sanitized
          # separately below so underscores never leak into the bundle ID.
          if not identifier or not re.fullmatch(r"[A-Za-z0-9-]+(?:\\.[A-Za-z0-9-]+)+", identifier):
              raise SystemExit(f"Invalid Tauri bundle identifier: {identifier!r}")
          print(f"Preserving valid Tauri bundle identifier: {identifier}")
          PY
      - name: Apply isolated desktop-safe Android source patch
        run: python jarvis-android-runtime/patch_tauri_android.py "$PROJECT"
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Configure Android SDK and NDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null
          set -o pipefail
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$SDK_ROOT/ndk/27.0.12077973" >> "$GITHUB_ENV"
          echo "NDK_HOME=$SDK_ROOT/ndk/27.0.12077973" >> "$GITHUB_ENV"
      - name: Cache Rust and Tauri CLI
        id: cargo-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/cargo-tauri
            ~/.cargo/registry
            ~/.cargo/git
          key: jarvis-tauri-cli-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
      - name: Install Rust Android target and Tauri CLI
        timeout-minutes: 35
        env:
          CARGO_NET_RETRY: "5"
          CARGO_HTTP_TIMEOUT: "120"
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-linux-android
          if ! command -v cargo-tauri >/dev/null 2>&1; then
            cargo install tauri-cli --version "^2" --locked --jobs 2
          fi
          cargo tauri --version
      - name: Initialize generated Android project
        working-directory: ${{ steps.source.outputs.project }}
        env:
          CI: "true"
        run: cargo tauri android init --ci --skip-targets-install
      - name: Configure embedded Python, native voice, and private runtime assets
        run: |
          python jarvis-android-runtime/configure_chaquopy.py \
            --project "$PROJECT" \
            --runtime "$GITHUB_WORKSPACE/jarvis-android-runtime" \
            --backend-source "$RUNNER_TEMP/backend/python" \
            --runtime-assets "$RUNNER_TEMP/runtime-assets"
      - name: Enforce Android-specific Python requirements in generated project
        shell: bash
        run: |
          set -euo pipefail
          ANDROID_REQUIREMENTS="$GITHUB_WORKSPACE/jarvis-android-runtime/requirements-android.txt"
          test -s "$ANDROID_REQUIREMENTS"
          # The generated Tauri project can contain more than one Python source-set
          # requirements file. Ensure every Android build source set uses the
          # pinned ARM64-compatible dependency list, not the desktop backend list.
          mapfile -t REQUIREMENT_FILES < <(find "$PROJECT" -type f -path '*/src/main/python/requirements.txt' -print)
          test "${#REQUIREMENT_FILES[@]}" -gt 0
          for requirements_file in "${REQUIREMENT_FILES[@]}"; do
            cp "$ANDROID_REQUIREMENTS" "$requirements_file"
            echo "Applied Android requirements: $requirements_file"
            grep -E '^(--extra-index-url|pydantic==|pydantic-core==)' "$requirements_file"
          done
      - name: Generate Tauri Gradle integration and check Rust Android host (no APK)
        shell: bash
        run: |
          set -euo pipefail
          IDENTIFIER="$(python -c 'import json; print(json.load(open("'"$PROJECT"'/src-tauri/tauri.conf.json"))["identifier"])')"
          # Tauri sanitizes hyphens in the generated MainActivity package, but
          # Wry receives this explicit package override. Apply the same safe
          # Kotlin identifier to keep generated Wry sources in that namespace.
          KOTLIN_PACKAGE="$(python - "$IDENTIFIER" <<'PY'
          import re
          import sys
          parts = []
          for segment in sys.argv[1].split("."):
              part = re.sub(r"[^A-Za-z0-9_]", "_", segment)
              if not part:
                  part = "_"
              if part[0].isdigit():
                  part = "_" + part
              parts.append(part)
          package = ".".join(parts)
          if len(parts) < 2 or not re.fullmatch(r"[A-Za-z_][A-Za-z0-9_]*(\.[A-Za-z_][A-Za-z0-9_]*)+", package):
              raise SystemExit(f"Invalid sanitized Kotlin package: {package}")
          print(package)
          PY
          )"
          PACKAGE_PATH="${KOTLIN_PACKAGE//./\/}"
          KOTLIN_OUT="$PROJECT/src-tauri/gen/android/app/src/main/java/$PACKAGE_PATH"
          mkdir -p "$KOTLIN_OUT"
          export TAURI_ANDROID_PROJECT_PATH="$PROJECT/src-tauri/gen/android"
          export TAURI_ANDROID_PACKAGE_UNESCAPED="$KOTLIN_PACKAGE"
          export WRY_ANDROID_PACKAGE="$KOTLIN_PACKAGE"
          export WRY_ANDROID_KOTLIN_FILES_OUT_DIR="$KOTLIN_OUT"
          export WRY_ANDROID_LIBRARY="$(python - "$PROJECT/src-tauri/Cargo.toml" <<'PY'
          import sys
          import tomllib
          from pathlib import Path
          manifest = tomllib.loads(Path(sys.argv[1]).read_text())
          library = manifest.get("lib", {}).get("name")
          if not library:
              library = manifest["package"]["name"].replace("-", "_")
          print(library)
          PY
          )"
          test -n "$WRY_ANDROID_LIBRARY"
          echo "Using WRY Android library: $WRY_ANDROID_LIBRARY"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_RUSTFLAGS="-Clink-arg=-landroid -Clink-arg=-llog -Clink-arg=-lOpenSLES"
          export TAURI_ENV_PLATFORM=android
          cd "$PROJECT/src-tauri"
          cargo check --target aarch64-linux-android
          test -s "$TAURI_ANDROID_PROJECT_PATH/tauri.settings.gradle"
          test -s "$TAURI_ANDROID_PROJECT_PATH/app/tauri.build.gradle.kts"
          MAIN_ACTIVITY="$(find "$TAURI_ANDROID_PROJECT_PATH/app/src/main/java" -name MainActivity.kt -print -quit)"
          test -n "$MAIN_ACTIVITY"
          MAIN_PACKAGE="$(sed -n 's/^package[[:space:]]\+//p' "$MAIN_ACTIVITY" | head -n 1)"
          test "$MAIN_PACKAGE" = "$KOTLIN_PACKAGE"
          grep -R --include='*.kt' -q "^package $KOTLIN_PACKAGE$" "$KOTLIN_OUT"
          if grep -R --include='*.kt' -nE '^package[[:space:]].*-' "$KOTLIN_OUT"; then
            echo "::error::Generated Wry Kotlin package contains an invalid hyphen"
            exit 1
          fi
      - name: Collect OAuth package and provisional debug signing details
        working-directory: ${{ steps.source.outputs.project }}/src-tauri/gen/android
        env:
          JARVIS_GOOGLE_WEB_CLIENT_ID: ${{ secrets.JARVIS_GOOGLE_WEB_CLIENT_ID || secrets.GOOGLE_WEB_CLIENT_ID }}
          JARVIS_GOOGLE_ANDROID_CLIENT_ID: ${{ secrets.JARVIS_GOOGLE_ANDROID_CLIENT_ID }}
          JARVIS_ANDROID_STABLE_SIGNING_SHA1: ${{ secrets.JARVIS_ANDROID_STABLE_SIGNING_SHA1 }}
        shell: bash
        run: |
          set -euo pipefail
          APP_ID="$(python - <<'PY'
          import re
          from pathlib import Path
          text = Path("app/build.gradle.kts").read_text()
          match = re.search(r'applicationId\s*=\s*"([^"]+)"', text)
          if not match:
              match = re.search(r'applicationId\s+"([^"]+)"', text)
          if not match:
              raise SystemExit("Android applicationId not found")
          print(match.group(1))
          PY
          )"
          ./gradlew signingReport --no-daemon > "$RUNNER_TEMP/signing-report.txt"
          DEBUG_SHA1="$(awk '/Variant: debug/{debug=1} debug && /SHA1:/{print $2; exit}' "$RUNNER_TEMP/signing-report.txt" | tr -d ':')"
          export JARVIS_ANDROID_APPLICATION_ID="$APP_ID"
          # Keep the user-provided stable SHA-1 separate from the temporary CI debug certificate.
          python "$GITHUB_WORKSPACE/jarvis-android-runtime/oauth_check.py" > "$RUNNER_TEMP/oauth-preflight.json"
          echo "Android application ID: $APP_ID"
          echo "Temporary CI debug SHA-1 present: $([ -n "$DEBUG_SHA1" ] && echo yes || echo no)"
          echo "Web OAuth client ID configured: $([ -n "$JARVIS_GOOGLE_WEB_CLIENT_ID" ] && echo yes || echo no)"
          echo "Android OAuth client ID configured: $([ -n "$JARVIS_GOOGLE_ANDROID_CLIENT_ID" ] && echo yes || echo no)"
          echo "Stable signing SHA-1 configured: $([ -n "$JARVIS_ANDROID_STABLE_SIGNING_SHA1" ] && echo yes || echo no)"
          cat "$RUNNER_TEMP/oauth-preflight.json"
          {
            echo "### OAuth preflight (IDs are never printed)"
            echo "- Android application ID: $APP_ID"
            echo "- Temporary CI debug SHA-1 present: $([ -n "$DEBUG_SHA1" ] && echo yes || echo no)"
            echo "- Web OAuth client ID configured: $([ -n "$JARVIS_GOOGLE_WEB_CLIENT_ID" ] && echo yes || echo no)"
            echo "- Android OAuth client ID configured: $([ -n "$JARVIS_GOOGLE_ANDROID_CLIENT_ID" ] && echo yes || echo no)"
            echo "- Stable signing SHA-1 configured: $([ -n "$JARVIS_ANDROID_STABLE_SIGNING_SHA1" ] && echo yes || echo no)"
            cat "$RUNNER_TEMP/oauth-preflight.json"
            echo "- A stable signing certificate is still required before final Android OAuth registration."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Verify Python package compatibility (no APK)
        working-directory: ${{ steps.source.outputs.project }}/src-tauri/gen/android
        run: |
          ./gradlew :app:generateArm64DebugPythonRequirementsAssets :app:generateUniversalDebugPythonRequirementsAssets --no-daemon
      - name: Compile native Android voice bridge (no APK)
        working-directory: ${{ steps.source.outputs.project }}/src-tauri/gen/android
        run: |
          ./gradlew :app:compileArm64DebugKotlin :app:compileUniversalDebugKotlin --no-daemon
      - name: Build JARVIS V3 Android ARM64 APK
        working-directory: ${{ steps.source.outputs.project }}
        timeout-minutes: 60
        env:
          CI: "true"
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
          NDK_HOME: ${{ env.NDK_HOME }}
        run: cargo tauri android build --apk --target aarch64 --ci
      - name: Sign and verify installable APK
        working-directory: ${{ steps.source.outputs.project }}
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find src-tauri/gen/android -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          test -x "$BUILD_TOOLS/apksigner"
          keytool -genkeypair -noprompt -keystore "$RUNNER_TEMP/jarvis-debug.keystore" \
            -storepass android -alias androiddebugkey -keypass android \
            -dname "CN=JARVIS Android Debug,O=JARVIS,C=IN" \
            -keyalg RSA -keysize 2048 -validity 10000
          "$BUILD_TOOLS/apksigner" sign --ks "$RUNNER_TEMP/jarvis-debug.keystore" \
            --ks-key-alias androiddebugkey --ks-pass pass:android --key-pass pass:android "$APK"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"
          keytool -printcert -jarfile "$APK" > "$RUNNER_TEMP/jarvis-apk-certificate.txt"
          SHA1="$(awk '/SHA1:/{print $2; exit}' "$RUNNER_TEMP/jarvis-apk-certificate.txt")"
          test -n "$SHA1"
          echo "APK_SIGNING_SHA1=$SHA1" >> "$GITHUB_ENV"
      - name: Package and upload direct APK artifact
        working-directory: ${{ steps.source.outputs.project }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/dist"
          APK="$(find src-tauri/gen/android -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          cp "$APK" "$GITHUB_WORKSPACE/dist/JARVIS-V3-Android-arm64.apk"
          sha256sum "$GITHUB_WORKSPACE/dist/JARVIS-V3-Android-arm64.apk" > "$GITHUB_WORKSPACE/dist/SHA256SUMS.txt"
          {
            echo "## Installable JARVIS V3 Android APK"
            echo "- ABI: ARM64 (arm64-v8a)"
            echo "- Signing: debug certificate; suitable for direct testing, not Play Store release"
            echo "- APK SHA-1: $APK_SIGNING_SHA1"
            echo "- Google Android OAuth client: not configured in this workflow; Google Sign-In may require later setup"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload JARVIS V3 Android APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-V3-Android-APK
          path: |
            dist/JARVIS-V3-Android-arm64.apk
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
      - name: Record Android build result
        if: always()
        run: |
          {
            echo "## JARVIS Android preparation"
            echo "- APK build: **completed by the preceding build/sign/upload steps when this job succeeds**"
            echo "- LLM workflow run: $LLM_RUN"
            echo "- Sidecar workflow run: $SIDECAR_RUN"
            echo "- Python backend artifact run: $BACKEND_RUN"
            echo "- Checks attempted: Chaquopy Python dependencies, Kotlin native voice bridge, Rust Android host."
            echo "- MEGWIL and desktop JARVIS source were not modified."
          } >> "$GITHUB_STEP_SUMMARY"
