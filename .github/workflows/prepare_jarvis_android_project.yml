          import sys
          parts = []
          for segment in sys.argv[1].split("."):
              part = re.sub(r"[^A-Za-z0-9_]", "_", segment)
              if not part:
                  part = "_"
              if part[0].isdigit():
                  part = "_" + part
              parts.append(part)
